version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: python -m taskqueue.worker
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    deploy:
      replicas: 2   # run multiple workers to demonstrate concurrent-safe dequeue

  scheduler:
    build: .
    command: python -m taskqueue.scheduler
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
